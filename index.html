<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Синопское сражение — Фактчекинг</title>
<style>
  :root {
    --bg: #f4f4f0;
    --ink: #1a1a1a;
    --muted: #8a8a82;
    --line: #e6e6e0;
    --accent: #8b2e2e;
    --good: #3a6b4a;
    --bad: #a33a3a;
    --gold: #b8860b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
    background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, var(--bg) 70%);
  }

  h1, h2, h3 { font-family: Georgia, 'Times New Roman', serif; font-weight: normal; }

  .app-container {
    width: 100%;
    max-width: 520px;
    padding: 20px;
    position: relative;
  }

  /* ============== ХЕДЕР ИГРЫ ============== */
  .game-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .game-header h1 {
    font-size: 28px;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .game-header p {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ============== СТАТУС-БАР ============== */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .hud span b {
    color: var(--ink);
    font-size: 18px;
    font-family: Georgia, serif;
    font-weight: normal;
    margin-left: 6px;
  }
  .streak-badge {
    color: var(--accent);
    opacity: 0;
    transition: opacity .3s;
  }
  .streak-badge.active { opacity: 1; }

  /* ============== ПРОГРЕСС И ТАЙМЕР ============== */
  .progress-track {
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 8px;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: var(--ink);
    width: 0%;
    transition: width .3s ease;
  }
  .timer-track {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .timer-fill {
    height: 100%;
    background: var(--accent);
    width: 100%;
    transition: width 0.1s linear;
  }

  /* ============== ЭКРАНЫ ============== */
  .screen { display: none; text-align: center; animation: fadeIn .4s ease; }
  .screen.active { display: block; }

  .screen h2 { font-size: 24px; margin-bottom: 12px; }
  .screen p { color: var(--muted); font-size: 15px; margin-bottom: 24px; }

  /* ============== КАРТОЧКИ ============== */
  .cardslot {
    position: relative;
    height: 280px;
    margin-bottom: 24px;
    perspective: 1000px;
  }

  .card {
    position: absolute;
    inset: 0;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
    cursor: grab;
    user-select: none;
    touch-action: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    transition: transform .3s cubic-bezier(.2,.8,.3,1), opacity .3s ease, border-color .2s;
    animation: cardIn .4s cubic-bezier(.2,.8,.3,1);
  }
  .card:active { cursor: grabbing; }
  .card.dragging { transition: none; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card.out-r { transform: translateX(120%) rotate(15deg) !important; opacity: 0; }
  .card.out-l { transform: translateX(-120%) rotate(-15deg) !important; opacity: 0; }

  .card.shake {
    animation: shake .4s ease;
    border-color: var(--bad);
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-8px) rotate(-1deg); }
    40% { transform: translateX(8px) rotate(1deg); }
    60% { transform: translateX(-4px) rotate(-1deg); }
    80% { transform: translateX(4px) rotate(1deg); }
  }

  .cnum {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .ctext {
    font-family: Georgia, serif;
    font-size: 20px;
    line-height: 1.5;
    color: var(--ink);
  }

  /* ============== ЭКРАН ОБЪЯСНЕНИЯ ============== */
  .explain {
    background: #ffffff;
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 12px;
    padding: 28px;
    text-align: left;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    animation: fadeIn .4s ease;
  }
  .e-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 600;
  }
  .e-label b { font-weight: normal; color: var(--ink); }
  .e-text {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    margin-bottom: 20px;
  }

  /* ============== КНОПКИ ============== */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .btn {
    padding: 16px;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    color: var(--ink);
    font-weight: 600;
    transition: all .2s;
  }
  .btn:hover { border-color: var(--ink); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .4; pointer-events: none; }
  
  .btn.fb:hover { background: #fdf5f5; border-color: var(--bad); color: var(--bad); }
  .btn.tb:hover { background: #f4f8f5; border-color: var(--good); color: var(--good); }
  .btn.primary { background: var(--ink); color: #fff; border: none; width: 100%; max-width: 200px; margin: 0 auto; display: block; }
  .btn.primary:hover { background: #333; }

  .swipe-hint {
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    opacity: 0.7;
  }

  /* ============== РЕЗУЛЬТАТ ============== */
  .rscore {
    font-family: Georgia, serif;
    font-size: 80px;
    line-height: 1;
    color: var(--ink);
    margin-bottom: 10px;
    animation: scorePop .5s cubic-bezier(.2,1.3,.4,1);
  }
  .rscore small { font-size: 24px; color: var(--muted); }
  @keyframes scorePop {
    0% { opacity: 0; transform: scale(.6); }
    60% { transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
  }
  .best-score { font-size: 13px; color: var(--muted); margin-bottom: 24px; text-transform: uppercase; letter-spacing: 1px;}
  .rtitle { font-size: 22px; margin-bottom: 8px; }
  .rdesc { color: var(--muted); font-size: 14px; margin-bottom: 32px; line-height: 1.6;}

  /* ============== ФЛЕШ-ЭФФЕКТ ============== */
  .flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    z-index: 100;
  }
  .flash.g { background: radial-gradient(circle, rgba(58,107,74,.1) 0%, transparent 70%); animation: flashAnim .4s ease; }
  .flash.r { background: radial-gradient(circle, rgba(163,58,58,.1) 0%, transparent 70%); animation: flashAnim .4s ease; }
  @keyframes flashAnim {
    0% { opacity: 0; }
    30% { opacity: 1; }
    100% { opacity: 0; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .cardslot { height: 260px; }
    .ctext { font-size: 18px; }
    .rscore { font-size: 64px; }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="game-header">
    <h1>Синопский фактчекинг</h1>
    <p>Триумф или пропаганда?</p>
  </div>

  <div class="flash" id="flash"></div>

  <!-- СТАРТОВЫЙ ЭКРАН -->
  <div id="startScreen" class="screen active">
    <h2>Проверьте себя</h2>
    <p>20 фактов о Синопском сражении. Отделите реальные исторические события от мифов и пропагандистских штампов британской прессы XIX века.</p>
    
    <div style="margin-bottom: 24px; text-align: left; background: #fff; padding: 16px; border-radius: 8px; border: 1px solid var(--line); font-size: 14px;">
      <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; margin-bottom: 10px;">
        <input type="radio" name="difficulty" value="easy" checked>
        <span><b>Мичман</b> — без таймера, можно подумать</span>
      </label>
      <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
        <input type="radio" name="difficulty" value="hard">
        <span><b>Адмирал</b> — 15 секунд на ответ, x2 балла</span>
      </label>
    </div>

    <button class="btn primary" id="startBtn">Начать сражение</button>
  </div>

  <!-- ЭКРАН ИГРЫ -->
  <div id="playScreen" class="screen">
    <div class="hud">
      <span>Вопрос <b id="cCounter">1</b>/<b id="cTotal">20</b></span>
      <span class="streak-badge" id="streakBadge">🔥 Комбо x2</span>
      <span>Баллы <b id="scoreDisp">0</b></span>
    </div>
    
    <div class="progress-track">
      <div class="progress-fill" id="gFill"></div>
    </div>
    <div class="timer-track" id="timerTrack" style="display: none;">
      <div class="timer-fill" id="timerFill"></div>
    </div>

    <div class="cardslot" id="cardSlot"></div>

    <div class="controls" id="gbtns">
      <button class="btn fb" id="falseBtn">← Неправда</button>
      <button class="btn tb" id="trueBtn">Правда →</button>
    </div>
    <div class="swipe-hint" id="swipeHint">Свайп влево или вправо</div>
  </div>

  <!-- ЭКРАН РЕЗУЛЬТАТА -->
  <div id="resultScreen" class="screen">
    <div class="rscore"><span id="finalScore">0</span><small> / 20</small></div>
    <div class="best-score" id="bestScoreDisp"></div>
    <h3 class="rtitle" id="achTitle"></h3>
    <p class="rdesc" id="achDesc"></p>
    <button class="btn primary" id="restartBtn">Сыграть снова</button>
  </div>
</div>

<script>
/* ============ ДАННЫЕ ============ */
var cards = [
  { text: "Синопское сражение произошло 18 (30) ноября 1853 года.", answer: true, explain: "Последняя крупная победа парусного флота в истории.", source: "[БРЭ]" },
  { text: "Турецкая эскадра насчитывала 720 орудий.", answer: false, explain: "У турок было 510 орудий на кораблях и 38 береговых. 720 орудий было у русской эскадры.", source: "[Культура.РФ]" },
  { text: "Русская эскадра имела на вооружении 76 бомбических пушек.", answer: true, explain: "Именно бомбические пушки, стрелявшие разрывными снарядами, во многом решили исход боя.", source: "[БРЭ]" },
  { text: "Бой длился около четырёх с половиной часов.", answer: true, explain: "К 17:00 сопротивление турок было окончательно сломлено.", source: "[Военная литература]" },
  { text: "Из 16 турецких кораблей спаслись три парохода.", answer: false, explain: "Спасся только один — пароход «Таиф» под командой английского офицера Слейда.", source: "[Культура.РФ]" },
  { text: "Осман-паша попал в русский плен.", answer: true, explain: "Вместе с ним в плен попали около 200 турецких моряков.", source: "[bashinform.ru]" },
  { text: "Потери русских составили около 3000 человек.", answer: false, explain: "Потери русских: 37–38 убитых и 210–235 раненых. 3000–4000 — это потери турок.", source: "[Культура.РФ]" },
  { text: "Ни один русский корабль не был потоплен.", answer: true, explain: "Все 6 линейных кораблей и 2 фрегата уцелели, несмотря на серьёзные повреждения.", source: "[БРЭ]" },
  { text: "The Times назвала сражение «Синопской резнёй».", answer: true, explain: "Этот ярлык был подхвачен другими изданиями в рамках антироссийской пропаганды.", source: "[Научная статья]" },
  { text: "Есть документальные подтверждения расстрела раненых турок в воде.", answer: false, explain: "Таких документов не существует. Нахимов приказывал щадить пленных и оказывать им помощь.", source: "[rossaprimavera.ru]" },
  { text: "Нахимов приказывал прекращать огонь по спустившим флаг кораблям.", answer: true, explain: "Это исторический факт, подтверждённый приказами адмирала.", source: "[Военная литература]" },
  { text: "Маркс опубликовал статьи о Синопе в 1848 году.", answer: false, explain: "Статьи вышли в декабре 1853 — январе 1854. В 1848 году Маркс выпустил «Манифест Коммунистической партии».", source: "[De Gruyter Brill]" },
  { text: "Крымская война началась в октябре 1853 года.", answer: true, explain: "Россия вступила в войну с Турцией. Англия и Франция присоединились позже.", source: "[Институт славяноведения РАН]" },
  { text: "Англия и Франция вступили в войну в марте 1854 года.", answer: true, explain: "Через полгода после начала боевых действий.", source: "[Институт славяноведения РАН]" },
  { text: "Фраза Рассела «вырвать клыки у медведя» прозвучала в 1853 году.", answer: false, explain: "Цитата относится к 1854 году. Это была попытка оправдать эскалацию войны перед парламентом.", source: "[Институт славяноведения РАН]" },
  { text: "Русские корабли вошли в Синопскую бухту двумя колоннами.", answer: true, explain: "Флагман «Императрица Мария» шёл первым и принял на себя главный удар.", source: "[БРЭ]" },
  { text: "Флагманом Нахимова был корабль «Императрица Мария».", answer: true, explain: "На нём развевался флаг адмирала.", source: "[БРЭ]" },
  { text: "Пароходом «Таиф» командовал турецкий офицер.", answer: false, explain: "Им командовал английский офицер Слейд — единственный спасшийся корабль.", source: "[Культура.РФ]" },
  { text: "Турецкая эскадра защищалась 38 береговыми орудиями.", answer: true, explain: "В дополнение к 510 орудиям на кораблях.", source: "[БРЭ]" },
  { text: "Русские моряки намеренно сожгли город Синоп.", answer: false, explain: "Это пропагандистский миф британской прессы. Документальных подтверждений нет.", source: "[rossaprimavera.ru]" }
];

var achievements = [
  { min: 18, title: "Знаток сражений", desc: "Безупречный результат. Вы знаете Синопское сражение до мельчайших подробностей и не поддаётесь на пропагандистские мифы." },
  { min: 14, title: "Умный и рассудительный", desc: "Отличный результат. Вы уверенно отличаете факты от вымысла и хорошо разбираетесь в истории." },
  { min: 9, title: "Логичный и ловкий", desc: "Хорошее начало. Основные факты вы знаете, но некоторые детали стоит перечитать — особенно хронологию и цифры." },
  { min: 0, title: "Невежда и грубиян", desc: "Шутка, конечно. Но факты упрямы: вернитесь к источникам — и попробуйте снова." }
];

/* ============ ЭЛЕМЕНТЫ ============ */
var startScreen = document.getElementById('startScreen');
var playScreen = document.getElementById('playScreen');
var resultScreen = document.getElementById('resultScreen');
var cardSlot = document.getElementById('cardSlot');
var cCounter = document.getElementById('cCounter');
var cTotal = document.getElementById('cTotal');
var scoreDisp = document.getElementById('scoreDisp');
var gFill = document.getElementById('gFill');
var timerTrack = document.getElementById('timerTrack');
var timerFill = document.getElementById('timerFill');
var trueBtn = document.getElementById('trueBtn');
var falseBtn = document.getElementById('falseBtn');
var gbtns = document.getElementById('gbtns');
var swipeHint = document.getElementById('swipeHint');
var flash = document.getElementById('flash');
var streakBadge = document.getElementById('streakBadge');

/* ============ ПЕРЕМЕННЫЕ ИГРЫ ============ */
var deck = [];
var idx = 0;
var score = 0;
var streak = 0;
var locked = false;
var curCard = null;
var isHardMode = false;
var timerInterval = null;
var timeLeft = 15;

/* ============ ЗВУК ============ */
var audioCtx = null;
function getCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type, vol, delay) {
  var ctx = getCtx(); if (!ctx) return;
  var t = ctx.currentTime + (delay || 0);
  var osc = ctx.createOscillator(); var g = ctx.createGain();
  osc.type = type || 'sine'; osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || 0.08, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t + dur + 0.05);
}
function soundCorrect() { tone(659.25, 0.14, 'sine', 0.09, 0); tone(987.77, 0.24, 'sine', 0.09, 0.11); }
function soundWrong() { tone(196, 0.18, 'sawtooth', 0.06, 0); tone(155.56, 0.28, 'sawtooth', 0.06, 0.12); }
function soundTick() { tone(800, 0.05, 'square', 0.03, 0); }

/* ============ ЛОГИКА ============ */
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function startGame() {
  var diffRadios = document.getElementsByName('difficulty');
  isHardMode = (diffRadios[1] && diffRadios[1].checked);
  
  deck = shuffle(cards);
  idx = 0; score = 0; streak = 0; locked = false;
  scoreDisp.textContent = '0';
  cTotal.textContent = deck.length;
  streakBadge.classList.remove('active');
  
  startScreen.classList.remove('active');
  resultScreen.classList.remove('active');
  playScreen.classList.add('active');
  
  timerTrack.style.display = isHardMode ? 'block' : 'none';
  
  renderCard();
}

function updateHUD() {
  cCounter.textContent = idx + 1;
  gFill.style.width = (idx / deck.length * 100) + '%';
}

function bumpScore() {
  scoreDisp.textContent = score;
  scoreDisp.classList.remove('bump');
  void scoreDisp.offsetWidth;
  scoreDisp.classList.add('bump');
}

function startTimer() {
  if (!isHardMode) return;
  clearInterval(timerInterval);
  timeLeft = 15;
  timerFill.style.width = '100%';
  timerFill.style.transition = 'none';
  
  setTimeout(function() {
    timerFill.style.transition = 'width 0.1s linear';
  }, 50);

  timerInterval = setInterval(function() {
    timeLeft -= 0.1;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerFill.style.width = '0%';
      if (!locked) {
        answer(false, true); // Время вышло - засчитываем как ошибку (или можно сделать отдельно)
      }
    } else {
      timerFill.style.width = (timeLeft / 15 * 100) + '%';
      if (timeLeft <= 3.05 && timeLeft > 2.95) soundTick(); // Тик на последних секундах
    }
  }, 100);
}

function stopTimer() {
  clearInterval(timerInterval);
}

function renderCard() {
  if (idx >= deck.length) { showResult(); return; }
  locked = false;
  trueBtn.disabled = false;
  falseBtn.disabled = false;
  gbtns.style.display = 'grid';
  swipeHint.style.display = 'block';

  cardSlot.innerHTML = '';
  var c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = '<div class="cnum">' + (idx + 1) + ' / ' + deck.length + '</div>'
    + '<div class="ctext">' + deck[idx].text + '</div>';
  cardSlot.appendChild(c);
  curCard = c;
  bindDrag(c);
  updateHUD();
  startTimer();
}

function bindDrag(card) {
  var dragging = false; var sx = 0; var dx = 0;

  card.addEventListener('pointerdown', function(e) {
    if (locked) return;
    dragging = true; sx = e.clientX; dx = 0;
    card.classList.add('dragging');
    card.setPointerCapture(e.pointerId);
  });

  card.addEventListener('pointermove', function(e) {
    if (!dragging || locked) return;
    dx = e.clientX - sx;
    var rot = dx * 0.06;
    card.style.transform = 'translateX(' + dx + 'px) rotate(' + rot + 'deg)';
  });

  function finish() {
    if (!dragging || locked) return;
    dragging = false;
    card.classList.remove('dragging');
    if (dx > 80) answer(true);
    else if (dx < -80) answer(false);
    else card.style.transform = '';
  }

  card.addEventListener('pointerup', finish);
  card.addEventListener('pointercancel', finish);
}

function answer(val, isTimeout) {
  if (locked) return;
  locked = true;
  stopTimer();
  trueBtn.disabled = true;
  falseBtn.disabled = true;

  var correct = (val === deck[idx].answer) && !isTimeout;
  var card = curCard;
  card.classList.remove('dragging');
  card.style.transform = '';

  flash.classList.remove('g', 'r');
  void flash.offsetWidth;

  if (correct) {
    streak++;
    var points = isHardMode ? 2 : 1;
    if (streak >= 3) {
      points *= 2; // Бонус за комбо
      streakBadge.classList.add('active');
    } else {
      streakBadge.classList.remove('active');
    }
    score += points;
    
    bumpScore();
    flash.classList.add('g');
    soundCorrect();
    card.classList.add(val ? 'out-r' : 'out-l');
    
    setTimeout(function() {
      idx++;
      if (idx >= deck.length) { gFill.style.width = '100%'; setTimeout(showResult, 200); }
      else { renderCard(); }
    }, 380);
  } else {
    streak = 0;
    streakBadge.classList.remove('active');
    flash.classList.add('r');
    soundWrong();
    card.classList.add('shake');
    setTimeout(function() { showExplanation(isTimeout); }, 440);
  }
}

function showExplanation(isTimeout) {
  var c = deck[idx];
  var label = isTimeout ? "Время вышло!" : (c.answer ? 'Правда' : 'Неправда');
  gbtns.style.display = 'none';
  swipeHint.style.display = 'none';

  cardSlot.innerHTML =
    '<div class="explain">' +
      '<div class="e-label">' + label + ' <span style="color:var(--muted);font-size:10px;margin-left:8px;">' + c.source + '</span></div>' +
      '<p class="e-text">' + c.explain + '</p>' +
      '<div><button class="btn primary" id="nextBtn" style="max-width:100%;">Дальше</button></div>' +
    '</div>';

  document.getElementById('nextBtn').addEventListener('click', function() {
    idx++;
    if (idx >= deck.length) { gFill.style.width = '100%'; setTimeout(showResult, 200); }
    else { renderCard(); }
  });
}

function showResult() {
  playScreen.classList.remove('active');
  resultScreen.classList.add('active');
  document.getElementById('finalScore').textContent = score;

  var ach = achievements[achievements.length - 1];
  for (var i = 0; i < achievements.length; i++) {
    if (score >= (isHardMode ? achievements[i].min * 2 : achievements[i].min)) { ach = achievements[i]; break; }
  }
  document.getElementById('achTitle').textContent = ach.title;
  document.getElementById('achDesc').textContent = ach.desc;
  
  var best = localStorage.getItem('sinopBestScore') || 0;
  if (score > best) {
    localStorage.setItem('sinopBestScore', score);
    best = score;
    document.getElementById('bestScoreDisp').textContent = "🏆 Новый рекорд: " + best;
  } else {
    document.getElementById('bestScoreDisp').textContent = "🏆 Ваш рекорд: " + best;
  }
}

/* ============ СОБЫТИЯ ============ */
trueBtn.addEventListener('click', function() { answer(true); });
falseBtn.addEventListener('click', function() { answer(false); });
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

document.addEventListener('keydown', function(e) {
  if (!playScreen.classList.contains('active') || locked) return;
  if (e.key === 'ArrowRight') answer(true);
  if (e.key === 'ArrowLeft') answer(false);
});
</script>
